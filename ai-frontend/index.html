<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat con Agente IA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 550px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #007bff;
            color: white;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }

        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.4;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .user {
            background: #007bff;
            color: white;
            align-self: flex-end;
        }

        .assistant {
            background: #e9ecef;
            color: #333;
            align-self: flex-start;
        }

        .input-area {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #eee;
        }

        .input-area input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .input-area button {
            padding: 12px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .input-area button:hover {
            background: #0056b3;
        }

        .input-area button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            Agente de Inteligencia Artificial
        </div>

        <div id="chatBox" class="chat-box">
            <div class="message assistant">
                ¡Hola! Soy tu asistente de IA.
                ¿En qué puedo ayudarte?
            </div>
        </div>

        <form id="chatForm" class="input-area">
            <input type="text" id="userInput" placeholder="Escribe tu mensaje..." autocomplete="off" required>

            <button type="submit" id="sendButton">
                Enviar
            </button>
        </form>

    </div>

    <script src="app.js"></script>

</body>

</html>
